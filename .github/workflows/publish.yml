name: Publish

# One tag per package: v1.2.3 (core), anthropic-v1.2.3, openai-v1.2.3, gemini-v1.2.3, fs-v1.2.3.
# Each package must have this repository and workflow set as a trusted publisher on npm.
on:
  push:
    tags: ["v*", "anthropic-v*", "openai-v*", "gemini-v*", "fs-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub environment: add required reviewers to it (Settings > Environments) to approve each release.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the main-branch check below needs history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Pick the package from the tag
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            anthropic-v*) dir=packages/anthropic; ver="${GITHUB_REF_NAME#anthropic-v}" ;;
            openai-v*)    dir=packages/openai;    ver="${GITHUB_REF_NAME#openai-v}" ;;
            gemini-v*)    dir=packages/gemini;    ver="${GITHUB_REF_NAME#gemini-v}" ;;
            fs-v*)        dir=packages/fs;        ver="${GITHUB_REF_NAME#fs-v}" ;;
            v*)           dir=.;                  ver="${GITHUB_REF_NAME#v}" ;;
          esac
          actual=$(node -p "require('./$dir/package.json').version")
          test "$ver" = "$actual" || { echo "Tag version $ver does not match $dir/package.json version $actual"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Only publish tags on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tag is not on main"; exit 1; }
      - run: npm ci
      - run: npm run typecheck:all
      - run: npm run test:all
      # Tests use the workspace copy of the core, so check that a core version the companion accepts is on npm.
      # Push the core tag first and wait for it to publish before pushing companion tags.
      - name: Check the core version this package needs is published
        if: steps.pkg.outputs.dir != '.'
        run: |
          range=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').peerDependencies.nanoharness")
          npm view "nanoharness@$range" version > /dev/null || { echo "No published nanoharness matches $range; publish the core first"; exit 1; }
      - name: Publish with provenance
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public
